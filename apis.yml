aid: array-behavioral-care
name: Array Behavioral Care
description: 'Array Behavioral Care is a virtual psychiatry and therapy practice headquartered
  in Mount Laurel, New Jersey, delivering telebehavioral health across the continuum
  of care — from the emergency department to the outpatient clinic to the home. Founded
  in 1999 (formerly InSight + Regroup, rebranded to Array Behavioral Care in January
  2021), the company operates three product families — Array OnDemand Care (acute /
  emergency department consults), Array Community Care (outpatient clinics and physician
  groups) and Array AtHome (direct-to-patient virtual psychiatry and therapy) — unified
  since April 2025 under Array CareConnect. Its clinical technology is an Epic-based
  interoperable EHR with an Epic MyChart patient portal at mychart.arraybc.com. Array
  is accredited by The Joint Commission and earned HITRUST e1 certification for its
  integrated clinical systems in December 2024. It publishes no public developer program,
  API, SDK or machine-readable specification; integration with partner health systems
  runs through Epic interoperability and a referral portal rather than a self-service
  API.'
