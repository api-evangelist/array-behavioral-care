description: >-
  Array Behavioral Care is a virtual clinical practice, not an API vendor. Its
  conformance posture is therefore almost entirely on the healthcare
  accreditation and information-security side (Joint Commission, HITRUST, HIPAA)
  rather than the API-standards side. The one interoperability standard it
  plausibly touches — HL7 FHIR, via its Epic-based EHR — is not publicly
  reachable: Array does not appear in Epic's public FHIR endpoint directory and
  no CapabilityStatement is served from its MyChart host.
